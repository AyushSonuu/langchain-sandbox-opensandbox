[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-opensandbox"
description = "OpenSandbox sandbox integration for Deep Agents"
license = { text = "Apache-2.0" }
readme = "README.md"

classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.7.0",
    "opensandbox>=0.1.15",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_opensandbox"]

[project.urls]
Homepage = "https://github.com/AyushSonuu/langchain-opensandbox"
Repository = "https://github.com/AyushSonuu/langchain-opensandbox"
Documentation = "https://github.com/AyushSonuu/langchain-opensandbox#readme"

[dependency-groups]
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov",
    "pytest-socket",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.0,<1.0.0",
    "langchain-tests>=1.1.9",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "ANN401",  # Dynamically typed expressions are disallowed — too strict for generic wrappers
    "CPY001",  # Missing copyright notice — covered by the LICENSE file
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S108"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
testpaths = ["tests"]
asyncio_mode = "auto"
